<svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5ebe0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#edddd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c9b8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9956c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="180" fill="url(#bg)" rx="16"/>
  
  <!-- Decorative circles -->
  <circle cx="720" cy="30" r="60" fill="#c9956c" opacity="0.08"/>
  <circle cx="740" cy="160" r="45" fill="#d4a574" opacity="0.1"/>
  <circle cx="80" cy="150" r="50" fill="#b5838d" opacity="0.07"/>
  <circle cx="60" cy="20" r="35" fill="#c9956c" opacity="0.06"/>
  
  <!-- Small decorative dots -->
  <circle cx="160" cy="35" r="3" fill="#c9956c" opacity="0.3"/>
  <circle cx="175" cy="48" r="2" fill="#b5838d" opacity="0.25"/>
  <circle cx="148" cy="50" r="2" fill="#d4a574" opacity="0.2"/>
  <circle cx="620" cy="140" r="3" fill="#c9956c" opacity="0.25"/>
  <circle cx="635" cy="128" r="2" fill="#b5838d" opacity="0.2"/>

  <!-- Thin decorative line -->
  <line x1="40" y1="90" x2="100" y2="90" stroke="#c9956c" stroke-width="1" opacity="0.3"/>
  <line x1="700" y1="90" x2="760" y2="90" stroke="#c9956c" stroke-width="1" opacity="0.3"/>
  
  <!-- Name -->
  <text x="400" y="75" 
    font-family="Georgia, serif" 
    font-size="38" 
    font-weight="400"
    fill="#5c3d2e" 
    text-anchor="middle"
    letter-spacing="3">Fátima García Muriana</text>
  
  <!-- Divider -->
  <rect x="320" y="90" width="160" height="1" fill="url(#accent)" opacity="0.6" rx="1"/>
  
  <!-- Subtitle -->
  <text x="400" y="118" 
    font-family="Georgia, serif" 
    font-size="14" 
    fill="#8c5e45"
    text-anchor="middle"
    letter-spacing="2"
    font-style="italic">Desarrolladora Web Junior</text>
    
  <!-- Tags -->
  <text x="400" y="148" 
    font-family="Georgia, serif" 
    font-size="12" 
    fill="#a07050"
    text-anchor="middle"
    letter-spacing="1.5">Frontend  ·  Full-Stack  ·  Remoto</text>
</svg>